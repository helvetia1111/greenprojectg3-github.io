<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>scan</title>
    <link rel="stylesheet" href="css/main.css" type="text/css" />
</head>
<body>
	<!-- スキャン ----------------------->
    <div class="base" id="scan">
        <input type="button" value="Scan" id="btnScan" class="base"></input>
        <br />
        <input type="button" value="次へ" id="btnNext" class="base" disabled></input>
    </div>

	<!-- メイン ----------------------->
    <div class="mainbutton" id="main1">
		<input value="モニタ" type="button" id="monitor"/>

		<button name="ope" value="0" type="button" id="operation">運転</button>
	</div>

	<div class="mainbutton" id="main2">
		<input value="設定" type="button" id="setting"/>

		<input value="E-mail設定" type="submit" id="email"/>
	</div>

	<div class="mainbutton" id="main3">
		<input type="hidden" name="season" value="0" />
		<button name="ope" value="0" type="button" id="season1">時間設定1</button>

		<input type="hidden" name="season" value="1" />
		<button name="ope" value="0" type="button" id="season2">時間設定2</button>
	</div>

	<div class="mainbutton" id="main4">
		<input type="hidden" name="season" value="2" />
		<button name="ope" value="0" type="button" id="season3">時間設定3</button>

		<input type="hidden" name="season" value="3" />
		<button name="ope" value="0" type="button" id="season4">時間設定4</button>
	</div>

	<div class="messbutton" id="main5">
		<button name="ope" value="0" type="button" id="message">送信メッセージ設定</button>
	</div>

	<!-- モニタ ----------------------->
	<div class="mainbutton" id="monitor1">
		<input value="戻る" type="submit" />
	</div>

	<table class="table" border="1" style="border-collapse: collapse" id="monitor2">
		<tr>
			<td>システム時間</td>
			<td id="systemTime></td>
		</tr>
		<tr>
			<td>潅水計</td>
			<td id="fre"></td>
		</tr>
		<tr>
			<td>フロートスイッチ</td>
			<td id="float"></td>
		</tr>
		<tr>
			<td>雨スイッチ</td>
			<td id="rain"></td>
		</tr>
		<tr>
			<td>AD値系統1</td>
			<td id="ad"></td>
		</tr>
		<tr>
			<td>ステート</td>
			<td id="state"></td>
		</tr>
		<tr>
			<td>潅水時間タイマ</td>
			<td id="opeTime"></td>
		</tr>
		<tr>
			<td>潅水停止フラグ</td>
			<td id="stopFlag"></td>
		</tr>
		<tr>
			<td>液肥異常フラグ</td>
			<td id="liquidErrFlag"></td>
		</tr>
		<tr>
			<td>電源異常フラグ</td>
			<td id="pwrErrFlag"></td>
		</tr>
		<tr>
			<td>AD異常フラグ</td>
			<td id="adErrFlag"></td>
		</tr>
		<tr>
			<td>バッテリ電圧</td>
			<td id="batt"></td>
		</tr>
		<tr>
			<td>入力電圧</td>
			<td id="vIn"></td>
		</tr>
		<tr>
			<td>5V電圧</td>
			<td id="v5"></td>
		</tr>
		<tr>
			<td>3.7V電圧</td>
			<td id="v37"></td>
		</tr>
		<tr>
			<td>3.3V電圧</td>
			<td id="v33"></td>
		</tr>
		<tr>
			<td>2.5V電圧</td>
			<td id="v25"></td>
		</tr>
		<tr>
			<td>1.8V電圧</td>
			<td id="v18"></td>
		</tr>
		<tr>
			<td>1.2V電圧</td>
			<td id="v12"></td>
		</tr>
		<tr>
			<td>ボタン電池電圧</td>
			<td id="vBtn"></td>
		</tr>
	<table>
	
    <script type="text/javascript" src="js/scan.js"></script>
	<script type="text/javascript" src="js/main.js"></script>
</body>
</html>
